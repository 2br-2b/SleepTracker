name: Android Release Build

on:
  push:
    branches:
      - master
      - 'codex/**'
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Android SDK packages
        id: android-sdk-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/cache
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: ${{ runner.os }}-android-sdk-35-35.0.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.1.0-dev${{ github.run_number }}"
          bash ./gradlew --no-daemon --build-cache assembleRelease -PciVersionCode=${VERSION_CODE} -PciVersionName=${VERSION_NAME} -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: SleepTracker-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error